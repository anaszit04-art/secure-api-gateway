name: secure-api-gateway


x-python-service: &python-service
  build:
    context: .
    dockerfile: Dockerfile

  image: secure-api-gateway:phase3

  init: true
  restart: unless-stopped

  read_only: true

  tmpfs:
    - /tmp:size=16m,mode=1777

  security_opt:
    - no-new-privileges:true

  cap_drop:
    - ALL

  networks:
    - gateway-internal


services:
  service-a:
    <<: *python-service

    command:
      - python
      - -m
      - uvicorn
      - microservices.service_a.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"

    expose:
      - "8001"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8001/health',
          timeout=2
          )
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s


  service-b:
    <<: *python-service

    command:
      - python
      - -m
      - uvicorn
      - microservices.service_b.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8002"

    expose:
      - "8002"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8002/health',
          timeout=2
          )
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s


  redis:
    image: redis:7.4-alpine

    init: true
    user: redis
    restart: unless-stopped

    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru

    expose:
      - "6379"

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

    read_only: true

    tmpfs:
      - /data:size=32m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - gateway-internal


  gateway:
    <<: *python-service

    command:
      - python
      - -m
      - uvicorn
      - gateway.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    environment:
      SERVICE_A_URL: http://service-a:8001
      SERVICE_B_URL: http://service-b:8002

      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_ACCESS_TOKEN_MINUTES: "${JWT_ACCESS_TOKEN_MINUTES:-15}"
      JWT_ISSUER: "${JWT_ISSUER:-secure-api-gateway}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-secure-api-clients}"

      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: "${REDIS_KEY_PREFIX:-secure-api-gateway}"
      REDIS_CONNECT_TIMEOUT_SECONDS: "${REDIS_CONNECT_TIMEOUT_SECONDS:-2}"
      REDIS_SOCKET_TIMEOUT_SECONDS: "${REDIS_SOCKET_TIMEOUT_SECONDS:-2}"
      REDIS_MAX_CONNECTIONS: "${REDIS_MAX_CONNECTIONS:-20}"
      REDIS_VERIFY_ON_STARTUP: "true"

    depends_on:
      service-a:
        condition: service_healthy

      service-b:
        condition: service_healthy

      redis:
        condition: service_healthy

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/health',
          timeout=2
          )
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s


networks:
  gateway-internal:
    driver: bridge
