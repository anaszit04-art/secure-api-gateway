name: secure-api-gateway


x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"


x-python-service: &python-service
  build:
    context: .
    dockerfile: Dockerfile

  image: secure-api-gateway:phase7

  init: true
  restart: unless-stopped

  logging: *default-logging

  read_only: true

  tmpfs:
    - /tmp:size=16m,mode=1777

  security_opt:
    - no-new-privileges:true

  cap_drop:
    - ALL

  networks:
    - gateway-internal


services:
  service-a:
    <<: *python-service

    command:
      - python
      - -m
      - uvicorn
      - microservices.service_a.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --no-access-log

    expose:
      - "8001"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8001/health',
          timeout=2
          )
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s


  service-b:
    <<: *python-service

    command:
      - python
      - -m
      - uvicorn
      - microservices.service_b.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --no-access-log

    expose:
      - "8002"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8002/health',
          timeout=2
          )
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s



  postgres:
    image: postgres:18.4-alpine

    init: true
    restart: unless-stopped

    logging: *default-logging

    environment:
      POSTGRES_DB: "${POSTGRES_DB:-gateway}"
      POSTGRES_USER: "${POSTGRES_USER:-gateway}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

    expose:
      - "5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -U "$$POSTGRES_USER"
          -d "$$POSTGRES_DB"
          -h 127.0.0.1
          -p 5432
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    networks:
      - gateway-internal

  redis:
    image: redis:7.4-alpine

    init: true
    user: redis
    restart: unless-stopped

    logging: *default-logging

    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru

    expose:
      - "6379"

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

    read_only: true

    tmpfs:
      - /data:size=32m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - gateway-internal



  migrate:
    <<: *python-service

    restart: "no"

    command:
      - alembic
      - upgrade
      - head

    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-gateway}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-gateway}"
      DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-5}"
      DATABASE_MAX_OVERFLOW: "${DATABASE_MAX_OVERFLOW:-10}"
      DATABASE_POOL_TIMEOUT_SECONDS: "${DATABASE_POOL_TIMEOUT_SECONDS:-5}"
      DATABASE_CONNECT_TIMEOUT_SECONDS: "${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}"
      DATABASE_VERIFY_ON_STARTUP: "true"
      DATABASE_APPLICATION_NAME: "secure-api-gateway-migrations"

    depends_on:
      postgres:
        condition: service_healthy

    profiles:
      - tools


  gateway:
    <<: *python-service

    command:
      - python
      - -m
      - uvicorn
      - gateway.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log

    environment:
      SERVICE_A_URL: "${SERVICE_A_URL:-http://service-a:8001}"
      SERVICE_B_URL: "${SERVICE_B_URL:-http://service-b:8002}"


      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-gateway}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-gateway}"
      DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-5}"
      DATABASE_MAX_OVERFLOW: "${DATABASE_MAX_OVERFLOW:-10}"
      DATABASE_POOL_TIMEOUT_SECONDS: "${DATABASE_POOL_TIMEOUT_SECONDS:-5}"
      DATABASE_CONNECT_TIMEOUT_SECONDS: "${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}"
      DATABASE_VERIFY_ON_STARTUP: "true"
      DATABASE_APPLICATION_NAME: "${DATABASE_APPLICATION_NAME:-secure-api-gateway}"

      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_ACCESS_TOKEN_MINUTES: "${JWT_ACCESS_TOKEN_MINUTES:-15}"
      JWT_ISSUER: "${JWT_ISSUER:-secure-api-gateway}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-secure-api-clients}"

      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: "${REDIS_KEY_PREFIX:-secure-api-gateway}"
      REDIS_CONNECT_TIMEOUT_SECONDS: "${REDIS_CONNECT_TIMEOUT_SECONDS:-2}"
      REDIS_SOCKET_TIMEOUT_SECONDS: "${REDIS_SOCKET_TIMEOUT_SECONDS:-2}"
      REDIS_MAX_CONNECTIONS: "${REDIS_MAX_CONNECTIONS:-20}"
      REDIS_HEALTH_CHECK_INTERVAL_SECONDS: "${REDIS_HEALTH_CHECK_INTERVAL_SECONDS:-30}"
      REDIS_VERIFY_ON_STARTUP: "true"

      METRICS_ENABLED: "${METRICS_ENABLED:-true}"
      METRICS_HOST: "${METRICS_HOST:-0.0.0.0}"
      METRICS_PORT: "${METRICS_PORT:-9100}"

      UPSTREAM_MAX_ATTEMPTS: "${UPSTREAM_MAX_ATTEMPTS:-2}"
      UPSTREAM_RETRY_BASE_DELAY_SECONDS: "${UPSTREAM_RETRY_BASE_DELAY_SECONDS:-0.1}"
      UPSTREAM_CIRCUIT_FAILURE_THRESHOLD: "${UPSTREAM_CIRCUIT_FAILURE_THRESHOLD:-3}"
      UPSTREAM_CIRCUIT_RECOVERY_SECONDS: "${UPSTREAM_CIRCUIT_RECOVERY_SECONDS:-10}"


    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    expose:
      - "9100"

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/health',
          timeout=2
          )
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s


volumes:
  postgres-data:


networks:
  gateway-internal:
    driver: bridge
