name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13.14"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install \
            --requirement requirements.txt

      - name: Verify dependencies
        run: |
          python -m pip check

      - name: Compile Python sources
        run: |
          python -m compileall \
            -q \
            gateway \
            tests \
            migrations

      - name: Ruff critical checks
        run: |
          ruff check \
            gateway \
            tests \
            migrations

      - name: Run test suite
        run: |
          python -m pytest -q


  database:
    name: PostgreSQL migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: gateway
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd
          "pg_isready -U gateway -d gateway"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: >-
        postgresql+asyncpg://gateway:ci-postgres-password@127.0.0.1:5432/gateway
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "10"
      DATABASE_POOL_TIMEOUT_SECONDS: "5"
      DATABASE_CONNECT_TIMEOUT_SECONDS: "5"
      DATABASE_VERIFY_ON_STARTUP: "true"
      DATABASE_APPLICATION_NAME: "secure-api-gateway-ci"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install \
            --requirement requirements-runtime.txt

      - name: Apply migrations
        run: |
          alembic upgrade head

      - name: Require one Alembic head
        run: |
          set -euo pipefail

          head_count="$(
            alembic heads \
            | grep -c '(head)'
          )"

          echo "Alembic heads: $head_count"

          test "$head_count" -eq 1

      - name: Check model migration drift
        run: |
          alembic check


  container:
    name: Container and configuration validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      JWT_SECRET_KEY: >-
        ci-only-jwt-secret-value-at-least-32-characters
      POSTGRES_PASSWORD: ci-postgres-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose configuration
        run: |
          docker compose config --quiet

      - name: Build hardened image
        run: |
          docker build \
            --tag secure-api-gateway:ci \
            .

      - name: Verify image runtime user
        run: |
          set -euo pipefail

          image_user="$(
            docker image inspect \
              secure-api-gateway:ci \
              --format '{{.Config.User}}'
          )"

          echo "Runtime user: $image_user"

          test \
            "$image_user" \
            = "10001:10001"

      - name: Verify runtime secrets are not baked into image
        run: |
          set -euo pipefail

          if docker image inspect \
            secure-api-gateway:ci \
            --format \
            '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -Eq \
              '^(JWT_SECRET_KEY|POSTGRES_PASSWORD|DATABASE_URL)='
          then
            echo \
              "Runtime secret configuration was baked into the image."
            exit 1
          fi

          echo \
            "Image environment secret scan: OK"

      - name: Verify Docker history contains no runtime secrets
        run: |
          set -euo pipefail

          if docker history \
            --no-trunc \
            secure-api-gateway:ci \
            | grep -Ei \
              'JWT_SECRET_KEY|POSTGRES_PASSWORD|DATABASE_URL'
          then
            echo \
              "Sensitive runtime configuration found in image history."
            exit 1
          fi

          echo \
            "Docker history secret scan: OK"

      - name: Verify build-context exclusions
        run: |
          docker run \
            --rm \
            -i \
            --entrypoint python \
            secure-api-gateway:ci \
            - <<'PY'
          from pathlib import Path

          forbidden = (
              "/app/.env",
              "/app/.env.example",
              "/app/.git",
              "/app/tests",
              "/app/README.md",
          )

          for value in forbidden:
              path = Path(value)

              assert not path.exists(), (
                  f"Forbidden image artifact: {path}"
              )

          print(
              "Docker build-context exclusions: OK"
          )
          PY

      - name: Verify repository secret hygiene
        run: |
          set -euo pipefail

          if git ls-files \
            --error-unmatch \
            .env \
            >/dev/null 2>&1
          then
            echo \
              ".env must never be tracked."
            exit 1
          fi

          grep -qx \
            'JWT_SECRET_KEY=' \
            .env.example

          grep -qx \
            'POSTGRES_PASSWORD=' \
            .env.example

          echo \
            "Repository secret hygiene: OK"
